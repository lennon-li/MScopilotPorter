[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mscopilotporter"
version = "0.1.1"
description = "Local MCP gateway for Microsoft 365 Copilot Studio agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.2.0",
  "uvicorn==0.53.0",
  "starlette==1.6.0",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
]

[project.scripts]
mscopilotporter = "mscopilotporter.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mscopilotporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
